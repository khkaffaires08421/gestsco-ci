function moy(s,t){

}

 <div class="gr"><div class="card dashboard-panel"><h2 class="dashboard-panel-title">Répartition par sexe</h2><div class="ch"><canvas id="c1"></canvas></div></div><div class="card dashboard-panel"><h2 class="dashboard-panel-title">Affectés / non affectés</h2><div class="ch"><canvas id="c2"></canvas></div></div><div class="card dashboard-panel"><h2 class="dashboard-panel-title">Appréciations</h2><div class="ch"><canvas id="c3"></canvas></div></div></div>
 <div class="gr"><div class="card dashboard-panel"><h2 class="dashboard-panel-title">Effectifs par niveau</h2><div class="ch"><canvas id="c4"></canvas></div></div><div class="card dashboard-panel"><h2 class="dashboard-panel-title">Moyenne par classe (/20)</h2><div class="ch"><canvas id="c5"></canvas></div></div></div>
 <div class="card sc dashboard-panel"><div class="bar2"><h2 class="dashboard-panel-title" style="margin:0">Statistiques de la carte scolaire</h2><span class="ex">${exb('xSt')}</span></div><table><tr><th>Niveau</th><th>Garçons</th><th>Filles</th><th>Total</th><th>Redoublants</th><th>Affectés</th></tr>${statRows().map(r=>'<tr>'+r.map((c,i)=>'<td class="n">'+(i?c:'<b>'+c+'</b>')+'</td>').join('')+'</tr>').join('')}</table></div>
 ${top.length?`<div class="card sc"><h2>Meilleurs élèves (${pl()})</h2><table>${top.map((x,i)=>`<tr><td>${i+1}</td><td>${thumb(x[0])} ${esc(x[0].nom+' '+x[0].prenoms)}</td><td>${esc(cO(x[0]))}</td><td class="n">${f2(x[1])}/${bar(x[0].niveau)}</td></tr>`).join('')}</table></div>`:''}<div class="dashboard-credit">Application développée par KOFFI HERVE KOUAKOU</div>`}
function mk(id,type,lb,ds,o){var c=$('#'+id);if(c&&typeof Chart!=='undefined')charts.push(new Chart(c,{type:type,data:{labels:lb,datasets:ds},options:Object.assign({responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}},o||{})}))}
function drawCharts(){var P=['#0A7A4B','#F77F00','#2D6CDF','#C2185B','#8E6CEF','#14B8A6','#E5B800'],ct=f=>E.filter(f).length,gar=ct(s=>s.sexe=='M'),A=['Excellent','Très bien','Bien','Assez bien','Insuffisant','Médiocre'],ms=E.map(s=>[s,moy(s,T)]).filter(x=>x[1]!=null),nv=NV.filter(n=>E.some(s=>s.niveau==n)),cs=classes();
 mk('c1','doughnut',['Garçons','Filles'],[{data:[gar,E.length-gar],backgroundColor:[P[2],P[1]],borderWidth:0}]);
 mk('c2','pie',['Affecté(e)s','Non affecté(e)s'],[{data:[ct(s=>s.aff=='Affecté(e)'),ct(s=>s.aff!='Affecté(e)')],backgroundColor:[P[0],P[1]],borderWidth:0}]);
 mk('c3','pie',A,[{data:A.map(a=>ms.filter(x=>appr(x[1],bar(x[0].niveau))==a).length),backgroundColor:P,borderWidth:0}]);
 mk('c4','bar',nv,[{label:'Garçons',data:nv.map(n=>ct(s=>s.niveau==n&&s.sexe=='M')),backgroundColor:P[2]},{label:'Filles',data:nv.map(n=>ct(s=>s.niveau==n&&s.sexe!='M')),backgroundColor:P[1]}],{scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true}},plugins:{legend:{position:'bottom'}}});
 mk('c5','bar',cs,[{label:'Moyenne /20',data:cs.map(c=>{var a=ms.filter(x=>cO(x[0])==c);return a.length?+(a.reduce((p,x)=>p+x[1]/bar(x[0].niveau)*20,0)/a.length).toFixed(2):0}),backgroundColor:P[0]}],{scales:{y:{beginAtZero:true,max:20}},plugins:{legend:{display:false}}})}

function vEl(){var l=E.slice().sort((a,b)=>NV.indexOf(a.niveau)-NV.indexOf(b.niveau)||cO(a).localeCompare(cO(b))||a.nom.localeCompare(b.nom));
 return `<div class="bar2"><button class="btn" onclick="ed={niveau:'CP1',sexe:'M',red:'Non',aff:'Affecté(e)',nat:'Ivoirienne'};render()">+ Nouvel élève</button><input placeholder="Rechercher…" oninput="filt(this.value)" aria-label="Rechercher"><span class="ex">${exb('xEl')}</span><button class="s" onclick="cartes(E.slice().sort(ordE),'cartes-scolaires')">Cartes scolaires (PDF)</button></div>${ed?fEl():''}
 <div class="card sc"><table id="lst"><tr><th></th><th>Matricule</th><th>Nom et prénoms</th><th>Sexe</th><th>Classe</th><th>Statut</th><th></th></tr>${l.map(s=>`<tr data-t="${esc((s.nom+' '+s.prenoms+' '+(s.mat||'')+' '+cO(s)).toLowerCase())}"><td>${thumb(s)}</td><td>${esc(s.mat)}</td><td>${esc(s.nom+' '+s.prenoms)}</td><td>${s.sexe}</td><td>${esc(cO(s))}</td><td>${esc(s.aff)}${s.red=='Oui'?' <span class="bd r">Red.</span>':''}</td><td><button class="s" onclick="edit('${s.id}')">Modifier</button> <button class="s" onclick="cartes([E.find(x=>x.id=='${s.id}')],'carte-${esc(s.nom)}')">Carte</button> <button class="s" onclick="del('${s.id}',this)">Supprimer</button></td></tr>`).join('')||'<tr><td colspan="7" style="color:var(--mu)">Aucun élève pour l’instant.</td></tr>'}</table></div>`}
var filt=v=>document.querySelectorAll('#lst tr[data-t]').forEach(r=>r.style.display=r.dataset.t.includes(v.toLowerCase())?'':'none');
var op=(a,v)=>a.map(x=>`<option ${x==v?'selected':''}>${esc(x)}</option>`).join('');
function fEl(){var e=ed;return `<div class="card"><h2>${e.id?'Modifier':'Nouvel'} élève</h2><div class="fm">
<div><label>Matricule</label><input id="f_mat" value="${esc(e.mat)}"></div><div><label>Nom</label><input id="f_nom" value="${esc(e.nom)}"></div><div><label>Prénoms</label><input id="f_prenoms" value="${esc(e.prenoms)}"></div>
<div><label>Sexe</label><select id="f_sexe"><option value="M" ${e.sexe=='M'?'selected':''}>M</option><option value="F" ${e.sexe=='F'?'selected':''}>F</option></select></div>
<div><label>Date de naissance</label><input id="f_ddn" type="date" value="${esc(e.ddn)}"></div><div><label>Lieu de naissance</label><input id="f_lieu" value="${esc(e.lieu)}"></div>
<div><label>Niveau</label><select id="f_niveau">${op(NV,e.niveau)}</select></div><div><label>Division (A, B…)</label><input id="f_div" value="${esc(e.div)}"></div>
<div><label>Redoublant(e)</label><select id="f_red">${op(['Non','Oui'],e.red)}</select></div><div><label>Statut</label><select id="f_aff">${op(['Affecté(e)','Non affecté(e)'],e.aff)}</select></div><div><label>Nationalité</label><select id="f_nat">${op(['Ivoirienne','Étrangère'],e.nat)}</select></div>
<div><label>Photo</label><input type="file" accept="image/*" onchange="pick(this,'photo',220,'image/jpeg')"><img id="pv_photo" class="im" style="${e.photo?'':'display:none'}" src="${e.photo||''}" alt=""></div></div>
<div class="bar2" style="margin:12px 0 0"><button class="btn" onclick="saveEl()">Enregistrer</button><button class="s" onclick="ed=null;render()">Annuler</button></div></div>`}
function pick(inp,k,max,type){var f=inp.files[0];if(!f)return;var transparent=(k==='sig'||k==='cac'),r=new FileReader();r.onload=()=>{var i=new Image();i.onload=()=>{var z=Math.min(1,max/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.max(1,Math.round(i.width*z));c.height=Math.max(1,Math.round(i.height*z));var x=c.getContext('2d',{willReadFrequently:true});x.clearRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);if(transparent){var im=x.getImageData(0,0,c.width,c.height),px=im.data;for(var q=0;q<px.length;q+=4){var mx=Math.max(px[q],px[q+1],px[q+2]),mn=Math.min(px[q],px[q+1],px[q+2]);if(px[q]>238&&px[q+1]>238&&px[q+2]>238){px[q+3]=0}else if(mx-mn<18&&mx>218){px[q+3]=Math.round(px[q+3]*(255-mx)/37)}}x.putImageData(im,0,0)}else if(type==='image/jpeg'){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height)}var outType=transparent?'image/png':type,u=c.toDataURL(outType,.9);(ed||C)[k]=u;var p=$('#pv_'+k);if(p){p.src=u;p.style.display='block'}};i.src=r.result};r.readAsDataURL(f)}
var edit=id=>{ed=Object.assign({},E.find(s=>s.id==id));render()};
async function saveEl(){var g=i=>$('#f_'+i).value.trim(),o={nom:g('nom').toUpperCase(),prenoms:g('prenoms'),mat:g('mat'),sexe:g('sexe'),ddn:g('ddn'),lieu:g('lieu'),niveau:g('niveau'),div:g('div').toUpperCase(),red:g('red'),aff:g('aff'),nat:g('nat'),photo:ed.photo||''};
 if(!o.nom||!o.prenoms)return toast('Nom et prénoms obligatoires.');var old=ed.id?E.find(s=>s.id==ed.id):null,full=Object.assign({notes:{}},old||{},o);delete full.id;
 try{if(db){if(ed.id)await db.doc('eleves/'+ed.id).set(full);else await db.collection('eleves').add(full)}else{if(ed.id)Object.assign(old,full);else E.push(Object.assign({id:'l'+Date.now()},full));if(!persistLocalData())return}ed=null;toast('Élève enregistré.');render()}catch(e){toast('Enregistrement impossible.')}}
async function del(id,b){if(!b.dataset.c){b.dataset.c=1;b.textContent='Confirmer ?';return}try{if(db)await db.doc('eleves/'+id).delete();else{E=E.filter(s=>s.id!=id);if(!persistLocalData())return}toast('Élève supprimé.');render()}catch(e){toast('Suppression impossible.')}}

function vNt(){if(T=='A')T='1';var l=byCls(),sb=l.length?SB(l[0].niveau):[],B=l.length?bar(l[0].niveau):20;
 if(!l.length)return '<div class="card">Ajoutez d’abord des élèves pour saisir leurs notes.</div>';
 return `<div class="bar2">${clsSel()}${perSel(0)}<span style="color:var(--mu)">Chaque colonne indique son barème. Le total et la moyenne se calculent pendant la saisie.</span><button class="btn" onclick="saveNotes()">Enregistrer les notes</button></div><div class="card sc nt"><table><tr><th>Élève</th>${sb.map(x=>`<th>${esc(x[0])}<br>/${x[2]}${grp(l[0].niveau)=='p'?'':' · coef '+x[1]}</th>`).join('')}<th>Total</th><th>Moyenne</th></tr>${l.map(s=>`<tr><td>${esc(s.nom+' '+s.prenoms)}</td>${sb.map((x,i)=>{var v=((s.notes||{})[T]||{})['m'+i];return `<td><input inputmode="decimal" value="${v==null?'':v}" oninput="liveNote('${s.id}',${i},this)" onchange="setNote('${s.id}',${i},this.value,this)" aria-label="${esc(x[0])}"></td>`}).join('')}<td class="n" id="to${s.id}">${ttl(s)}</td><td class="n" id="mo${s.id}"><b>${f2(moy(s,T))}</b></td></tr>`).join('')}</table></div>`}
function setNote(id,i,v,el){var s=E.find(x=>x.id==id);if(!s)return;var B=SB(s.niveau)[i][2];s.notes=s.notes||{};var n=s.notes[T]=s.notes[T]||{};v=String(v==null?'':v).trim();
 if(v===''){delete n['m'+i]}else{var num=parseFloat(v.replace(',','.'));if(!Number.isFinite(num)||num<0||num>B){toast('La note doit être comprise entre 0 et '+B+'.');el.value=n['m'+i]==null?'':n['m'+i];return}n['m'+i]=num;el.value=String(num)}
 $('#mo'+id).innerHTML='<b>'+f2(moy(s,T))+'</b>';$('#to'+id).textContent=ttl(s);dirty[id]=1;
 if(!db){if(persistLocalData()){delete dirty[id];toast('Note enregistrée sur cet appareil.')}}
 else db.doc('eleves/'+id).update({notes:s.notes}).then(()=>{delete dirty[id]}).catch(()=>toast('Note non enregistrée en ligne. Cliquez sur « Enregistrer les notes » pour réessayer.'))
}
var dirty={},ttl=s=>{var t=tot(s,T);return f2(t[0])+' / '+t[1]};
function liveNote(id,i,el){var s=E.find(x=>x.id==id);if(!s)return;var mx=SB(s.niveau)[i][2],v=el.value.trim().replace(',','.');s.notes=s.notes||{};var n=s.notes[T]=s.notes[T]||{};
 if(v===''){delete n['m'+i];el.style.outline=''}else{var f=Number(v);if(!Number.isFinite(f)||f<0||f>mx){el.style.outline='2px solid var(--er)';dirty[id]=1;return}el.style.outline='';n['m'+i]=f}
 dirty[id]=1;$('#to'+id).textContent=ttl(s);$('#mo'+id).innerHTML='<b>'+f2(moy(s,T))+'</b>'}
async function saveNotes(){var ids=Object.keys(dirty);if(!ids.length)return toast('Aucune modification à enregistrer.');
 try{if(db){for(var k=0;k<ids.length;k++){var s=E.find(x=>x.id==ids[k]);if(s)await db.doc('eleves/'+ids[k]).update({notes:s.notes})}}else{if(!persistLocalData())return}dirty={};toast('Notes enregistrées pour '+ids.length+' élève(s).')}catch(e){toast('Enregistrement impossible. Vérifiez la connexion puis réessayez.')}}

function vRs(){var l=rowsRs();if(!l.length)return '<div class="card">Aucun élève à afficher.</div>';var B=bar(l[0].s.niveau),ss=l.map(x=>x.s),ms=l.map(x=>x.m).filter(x=>x!=null),av=ms.length?ms.reduce((p,c)=>p+c,0)/ms.length:null,okn=ms.filter(x=>x>=B/2).length;
 return `<div class="bar2">${clsSel()}${perSel(1)}<span class="ex">${exb('xRs')}</span><button class="s" onclick="bulls(rowsRs().map(x=>x.s),'bulletins-'+cls.replace(/\\s/g,'_')+'-'+T)">Bulletins de la classe (PDF)</button><button class="s" onclick="cartes(byCls(),'cartes-'+cls.replace(/\\s/g,'_'))">Cartes de la classe (PDF)</button><button class="s" onclick="bulls(E.slice().sort(ordE),'bulletins-tous-'+T)">Tous les bulletins de l’école (PDF)</button></div>
 <div class="kp"><div><b>${f2(av)}</b><span>Moyenne de la classe /${B}</span></div><div><b>${f2(ms.length?Math.max.apply(0,ms):null)}</b><span>Plus forte</span></div><div><b>${f2(ms.length?Math.min.apply(0,ms):null)}</b><span>Plus faible</span></div><div><b>${ms.length?Math.round(okn/ms.length*100)+' %':'–'}</b><span>Réussite (≥ ${B/2})</span></div></div>
 <div class="card sc"><table><tr><th>Rang</th><th></th><th>Nom et prénoms</th><th>Moyenne /${B}</th><th>Appréciation</th><th>${T=='A'?'Décision':'Distinction'}</th><th></th></tr>${l.map(x=>`<tr><td class="n">${rk(ss,T,x.s)}</td><td>${thumb(x.s)}</td><td>${esc(x.s.nom+' '+x.s.prenoms)}</td><td class="n"><b>${f2(x.m)}</b></td><td>${appr(x.m,B)}</td><td>${T=='A'?(dec(x.s)?`<span class="bd ${dec(x.s)=='Redouble'?'r':''}">${dec(x.s)}</span>`:''):esc(dist(x.m,B))}</td><td><button class="s" onclick="bull1('${x.s.id}')">Bulletin PDF</button></td></tr>`).join('')}</table></div>`}

function vPr(){var f=(k,l)=>`<div><label>${l}</label><input id="c_${k}" value="${esc(C[k])}"></div>`;
 return `<div class="card"><div class="fm">${f('nom','Nom de l’établissement')}${f('code','Code établissement')}<div><label>Année scolaire</label><input id="c_annee" value="2026-2027" readonly aria-readonly="true" title="Année scolaire fixe : 2026-2027" style="background:var(--ln);cursor:not-allowed"></div>${f('dir','Nom du directeur / de la directrice')}${f('drena','DRENA')}${f('iepp','IEPP (primaire)')}${f('adr','Adresse')}${f('tel','Téléphone')}
 <div><label>Signature du directeur</label><input type="file" accept="image/*" onchange="pick(this,'sig',320,'image/png')"><img id="pv_sig" class="im" style="${C.sig?'':'display:none'}" src="${C.sig||''}" alt=""></div>
 <div><label>Armoiries (filigrane et en-tête)</label><input type="file" accept="image/*" onchange="pick(this,'arm',320,'image/jpeg')"><img id="pv_arm" class="im" style="${C.arm?'':'display:none'}" src="${C.arm||''}" alt=""></div>
 <div><label>Cachet de l’établissement</label><input type="file" accept="image/*" onchange="pick(this,'cac',260,'image/png')"><img id="pv_cac" class="im" style="${C.cac?'':'display:none'}" src="${C.cac||''}" alt=""></div></div>
 <div class="bar2" style="margin:14px 0 0"><button class="btn" onclick="saveC()">Enregistrer</button></div></div>
 <div class="card"><h2>Sauvegarde locale</h2><p>Exportez les élèves, les notes et les paramètres dans un fichier JSON.</p><button class="btn" onclick="exportBackup()">Télécharger la sauvegarde JSON</button> <label class="s" style="display:inline-block;cursor:pointer">Restaurer JSON<input type="file" accept="application/json,.json" style="display:none" onchange="importBackup(this)"></label></div>
 <div class="card"><h2>Barèmes appliqués</h2><p style="margin:0;color:var(--mu)">CP1 à CE2 : moyenne sur 10 (passage à 5). CM1, CM2 et secondaire : moyenne sur 20 (passage à 10). Moyenne = points pondérés / total des barèmes × barème de la classe ; moyenne annuelle = moyenne des trois trimestres.</p></div>${vCo()}`}
async function saveC(){['nom','code','dir','drena','iepp','adr','tel'].forEach(k=>C[k]=$('#c_'+k).value.trim());C.annee='2026-2027';try{if(db)await db.doc('config/ecole').set(C);else if(!persistLocalData())return;toast('Paramètres enregistrés.');render()}catch(e){toast('Enregistrement impossible.')}}
function exportBackup(){var payload={format:'GESTSCO_CI_BACKUP_V1',date:new Date().toISOString(),ecole:C,eleves:E};save('sauvegarde-gestsco-ci.json',new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'}))}
async function importBackup(inp){var f=inp.files&&inp.files[0];if(!f)return;try{var data=JSON.parse(await f.text());if(!data||!Array.isArray(data.eleves)||!data.ecole)throw new Error('format');if(!confirm('Restaurer cette sauvegarde remplacera les données visibles dans cette application. Continuer ?')){inp.value='';return}C=Object.assign(C,data.ecole);C.annee='2026-2027';E=data.eleves;if(db){toast('Import non appliqué à la base en ligne. Utilisez la procédure de sauvegarde de la base connectée.')}else if(!persistLocalData())return;else{toast('Sauvegarde restaurée.');render()}}catch(e){toast('Fichier JSON invalide ou illisible.')}finally{inp.value=''}}
try{if(localStorage.getItem('GESTSCO_CI_AUTH_OK_V1')==='1'){ok=true;boot()}else render()}catch(e){render()}
